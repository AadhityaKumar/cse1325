  workingDirectory: '$(System.DefaultWorkingDirectory)/Azure/SQL'

- task: SqlDacpacDeploymentOnMachineGroup@0
  inputs:
    TaskType: 'sqlQuery'
    SqlFile: '$(System.DefaultWorkingDirectory)/Azure/SQL/publication.sql'
    ServerName: 'LAPTOP-I73C2NHS\SQLEXPRESS'
    DatabaseName: 'aadhitya'
    AuthScheme: 'windowsAuthentication'